name: Generate Snake

# Kapan robot ini berjalan?
on:
  schedule:
    # Berjalan otomatis setiap 12 jam
    - cron: "0 */12 * * *"
  
  # Mengizinkan kita menjalankan script ini secara manual
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # Mengambil data dari username-mu
          github_user_name: ${{ github.repository_owner }}
          # Output animasi yang dihasilkan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Mendorong (push) gambar yang sudah dibuat ke branch bernama 'output'
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
